<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos VaaL - Faltantes</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f4f4f4;
    }
    h1 {
      color: #333;
    }
    #formulario {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    #inputItem {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: white;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    li.llegado span {
      text-decoration: line-through;
      color: #999;
    }
  </style>
</head>
<body>

  <h1>Repuestos faltantes</h1>

  <form id="formulario">
    <input type="text" id="inputItem" placeholder="Ej: filtro de aceite Hilux x3" required>
    <button type="submit">Agregar</button>
  </form>

  <ul id="lista"></ul>

  <script type="module" src="app.js"></script>
</body>
</html>
