<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos VaaL - Faltantes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul-noche: #16425B;
      --azul-medio: #2E6E8E;
      --naranja-fuego: #E8630A;
      --rojo-casco: #B7202E;
      --ocre: #F2A93B;
      --crema: #FCEEDD;
      --tinta: #1A1A1A;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Work Sans', Arial, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      background: linear-gradient(180deg, var(--azul-noche) 0%, var(--azul-medio) 45%, var(--naranja-fuego) 100%);
      min-height: 100vh;
    }

    h1 {
      font-family: 'Anton', 'Work Sans', sans-serif;
      font-weight: 400;
      font-size: 2.1rem;
      color: var(--crema);
      text-shadow: 3px 3px 0 var(--tinta);
      margin: 8px 0 20px;
      letter-spacing: 0.5px;
    }

    #formulario {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      background: var(--crema);
      padding: 12px;
      border: 3px solid var(--tinta);
      box-shadow: 5px 5px 0 var(--tinta);
    }

    #selectProveedor, #inputItem {
      padding: 10px;
      font-size: 16px;
      border: 2px solid var(--tinta);
      background: white;
      font-family: 'Work Sans', sans-serif;
    }

    #inputItem { flex: 1; min-width: 200px; }

    button {
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid var(--tinta);
      background: var(--naranja-fuego);
      color: var(--crema);
      font-family: 'Work Sans', sans-serif;
    }

    button:hover { background: var(--rojo-casco); }

    #pestañas {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      align-items: center;
    }

    .pestaña {
      padding: 8px 14px;
      border: 2px solid var(--tinta);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: var(--tinta);
      background: var(--ocre);
      font-family: 'Work Sans', sans-serif;
    }

    .pestaña:nth-child(3n+2) { background: var(--azul-medio); color: var(--crema); }
    .pestaña:nth-child(3n) { background: var(--rojo-casco); color: var(--crema); }

    .pestaña.activa {
      background: var(--tinta);
      color: var(--crema);
      box-shadow: 3px 3px 0 var(--naranja-fuego);
    }

    #botonNuevoProveedor {
      background: var(--crema);
      color: var(--tinta);
      border: 2px dashed var(--tinta);
      font-size: 13px;
    }

    #formNuevoProveedor {
      display: none;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--crema);
      padding: 10px;
      border: 2px solid var(--tinta);
    }
    #formNuevoProveedor.visible { display: flex; }
    #inputNuevoProveedor {
      padding: 8px;
      font-size: 14px;
      flex: 1;
      border: 2px solid var(--tinta);
    }

    #botonPasarPedido {
      display: none;
      margin-bottom: 16px;
      background: var(--azul-noche);
      color: var(--crema);
    }
    #botonPasarPedido.visible { display: inline-block; }

    #botonEliminarProveedor {
      display: none;
      margin-bottom: 16px;
      margin-left: 8px;
      background: var(--rojo-casco);
      color: var(--crema);
    }
    #botonEliminarProveedor.visible { display: inline-block; }

    #botonArchivados {
      display: block;
      background: none;
      border: none;
      color: var(--crema);
      text-decoration: underline;
      cursor: pointer;
      padding: 0 0 16px 0;
      font-size: 14px;
      font-weight: 600;
    }
    #botonArchivados:hover { background: none; color: var(--ocre); }

    .divisor-corte {
      border-top: 3px solid var(--tinta);
      margin: 20px 0 10px;
      padding-top: 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--crema);
