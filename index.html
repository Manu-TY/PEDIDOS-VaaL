<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos VaaL - Faltantes</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #f4f4f4; }
    h1 { color: #333; }
    #formulario { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    #selectProveedor, #inputItem { padding: 10px; font-size: 16px; }
    #inputItem { flex: 1; min-width: 200px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    #pestañas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .pestaña { padding: 8px 12px; background: #ddd; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .pestaña.activa { background: #333; color: white; }
    #botonArchivados { background: none; border: none; color: #555; text-decoration: underline; cursor: pointer; padding: 0 0 16px 0; font-size: 14px; }
    ul { list-style: none; padding: 0; }
    li { background: white; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; align-items: center; gap: 10px; }
    li .proveedor { font-size: 12px; color: #888; margin-left: auto; }
    li .fecha { font-size: 12px; color: #888; }
    li.llegado span.texto { text-decoration: line-through; color: #999; }
  </style>
</head>
<body>

  <h1>Repuestos faltantes</h1>

  <form id="formulario">
    <select id="selectProveedor"></select>
    <input type="text" id="inputItem" placeholder="Ej: filtro de aceite Hilux x3" required>
    <button type="submit">Agregar</button>
  </form>

  <div id="pestañas"></div>

  <button id="botonArchivados">Ver archivados</button>

  <ul id="lista"></ul>

  <script type="module" src="app.js"></script>
</body>
</html>
